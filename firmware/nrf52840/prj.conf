CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_POWEROFF=y
CONFIG_FPU=y

# Log power-button and power-state transitions over USB serial.
CONFIG_TINYCARDIA_POWER_BUTTON_DEBUG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tinycardia"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=65

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Tinycardia v2"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Tinycardia"
